name: CD

run-name: Publish ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
      - '!v*'

jobs:
  gen:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      PREFIX: crate
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Generate bindings
        working-directory: ${{ env.PREFIX }}
        run: ./bindgen.sh

      - name: Stage generated code
        run: git add --force .

      - name: Create tree from ecosystem directory
        id: tree
        run: |
          TREE=$(git write-tree --prefix=${{ env.PREFIX }}/)
          echo "TREE=${TREE}" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create orphan commit
        id: commit
        run: |
          COMMIT=$(git commit-tree ${{ steps.tree.outputs.TREE }} -m "chore: generate code")
          echo "COMMIT=${COMMIT}" >> $GITHUB_OUTPUT

      - name: Create release tag
        run: git tag v${{ github.ref_name }} ${{ steps.commit.outputs.COMMIT }}

      - name: Push gen commit
        run: git push --force origin ${{ steps.commit.outputs.COMMIT }}:refs/heads/gen

      - name: Push release tag
        shell: bash
        run: git push origin v${{ github.ref_name }}
