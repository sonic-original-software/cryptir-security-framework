name: CD

run-name: Publish ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
      - '!v*'

jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Pop release
        uses: katastroma/skeuotheke/.github/actions/pop-release@v0
        with:
          ecosystem: "crate"
